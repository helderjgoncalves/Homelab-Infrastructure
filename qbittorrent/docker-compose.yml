services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PGID=100
      - UMASK=002
      - TZ=Europe/Lisbon
      - WEBUI_PORT=9080
      - TORRENTING_PORT=51513
    volumes:
      - ./appdata:/config
      - ${QBT_DOWNLOADS_DIR}:/downloads
      - ${QBT_MUSIC_DIR}:/music
      - ${QBT_MOVIES_DIR}:/movies
      - ${QBT_TV_DIR}:/tv

    ports:
      - 127.0.0.1:9080:9080
      - 51513:51513
      - 51513:51513/udp
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

