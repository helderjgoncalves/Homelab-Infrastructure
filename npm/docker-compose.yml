services:
  npm:
    container_name: npm
    image: jc21/nginx-proxy-manager:2
    restart: unless-stopped
    network_mode: host
    dns:
      - ${LAN_DNS_IP:?set LAN_DNS_IP in .env}
    # network_mode: host means the container binds these directly on the
    # host: 80 (HTTP), 443 (HTTPS), 81 (admin UI). A `ports:` block would
    # be ignored in host networking, so it is intentionally omitted.
    #
    # Host networking is REQUIRED, not incidental: every other stack binds its
    # UI to 127.0.0.1, and NPM reaches those origins over the host loopback
    # (e.g. http://127.0.0.1:2283 for Immich). Moving NPM into a bridge network
    # would make 127.0.0.1 resolve to NPM's own namespace and break all ingress.
    #
    # Consequence: port 81 (admin UI) cannot be restricted with a bind address
    # here and is reachable from the LAN, protected only by NPM's own login.
    # Contain it at the host firewall instead, then reach the UI through an SSH
    # tunnel. Test the tunnel before relying on a DROP rule: locking yourself
    # out of the proxy admin while the proxy is your only ingress is painful.
    environment:
      # Uncomment this if you want to change the location of
      # the SQLite DB file within the container
      # DB_SQLITE_FILE: "/data/database.sqlite"

      # Uncomment this if IPv6 is not enabled on your host
      DISABLE_IPV6: "true"
    volumes:
      # Host base path supplied via .env (or Dockge stack environment
      # variables) so the compose file stays host-agnostic.
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:81/api"]
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 30s
networks: {}
