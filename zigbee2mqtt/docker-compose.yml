name: zigbee2mqtt
# Own stack, not the Home Assistant compose. HA restarts must not drop the
# coordinator. Do not start this while ZHA is enabled: the Dongle-M accepts
# one TCP client on 192.168.1.109:6638.
services:
  mosquitto:
    # Loopback only. Home Assistant is on the host network and uses
    # 127.0.0.1:1883. Zigbee2MQTT uses the same address.
    # updates/ takes 2.1 patches; a new minor is mailed, moved to by hand.
    # 2.1 is only published as -alpine.
    image: eclipse-mosquitto:2.1-alpine
    container_name: mosquitto
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Lisbon
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
    healthcheck:
      # Anonymous clients are refused, and that refusal is an MQTT answer:
      # the broker is up. No credentials needed.
      test:
        - CMD-SHELL
        - >-
          mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/broker/version' -C 1 -W 3 2>&1
          | grep -qE 'not authorised|^mosquitto version'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  zigbee2mqtt:
    # updates/ takes 2.14 patches; a new minor is mailed, moved to by hand.
    image: ghcr.io/koenkk/zigbee2mqtt:2.14
    container_name: zigbee2mqtt
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mosquitto
    environment:
      - TZ=Europe/Lisbon
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8210').then(()=>process.exit(0)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
