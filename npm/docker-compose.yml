services:
  npm:
    container_name: npm
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    network_mode: host
    dns:
      - ${LAN_DNS_IP}
    # network_mode: host means the container binds these directly on the
    # host: 80 (HTTP), 443 (HTTPS), 81 (admin UI). A `ports:` block would
    # be ignored in host networking, so it is intentionally omitted.
    environment:
      # Uncomment this if you want to change the location of
      # the SQLite DB file within the container
      # DB_SQLITE_FILE: "/data/database.sqlite"

      # Uncomment this if IPv6 is not enabled on your host
      DISABLE_IPV6: "true"
    volumes:
      # Host base path supplied via .env (or Dockge stack environment
      # variables) so the compose file stays host-agnostic.
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:81/api
      interval: 120s
      timeout: 5s
      retries: 3
      start_period: 30s
networks: {}
