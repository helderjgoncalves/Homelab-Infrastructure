    comment: Perflyst SmartTV Blocklist

# ----- Exact-match deny domains (Domains page, Type: Exact deny) -------------
deny_exact:
  - domain: tracker1.bt.moack.co.kr
    enabled: true

# ----- Regex deny patterns (Domains page, Type: Regex deny) ------------------
deny_regex:
  - pattern: tracker\..*
    enabled: true
