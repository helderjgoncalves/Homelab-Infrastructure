# Immich
# -----------------------------------------------------------------------------
# Adapted from the upstream compose at:
#   https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# Local changes from upstream:
#   - DB_DATA_LOCATION removed; postgres data lives under ${SSD_LOCATION}/postgres
#     (merged into a single SSD path).
#   - External photo libraries parameterised via ${IMMICH_HOMES_BASE} so the
#     LAN-specific base path stays out of Git; per-user subfolder names remain
#     in compose because they describe what's mounted.
#   - Hardware acceleration left enabled for Intel iGPU (/dev/dri) and the
#     OpenVINO ML image variant.
#
# env_file: stack.env  is Portainer's convention (Portainer auto-creates the
# file from the stack environment-variables UI). For shell deploys, copy
# stack.env.example to stack.env in this directory.

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    devices:
      - /dev/dri:/dev/dri         # Intel iGPU (transcoding)
    volumes:
      # Originals / uploads — typically big slow storage (HDD/RAID).
      - ${UPLOAD_LOCATION}:/data
      # Derived/operational data — fast SSD storage.
      - ${SSD_LOCATION}/library/thumbs:/data/thumbs
      - ${SSD_LOCATION}/library/backups:/data/backups
      - ${SSD_LOCATION}/library/profile:/data/profile
      - ${SSD_LOCATION}/library/encoded-video:/data/encoded-video
      - /etc/localtime:/etc/localtime:ro
      # External libraries — Immich indexes existing on-NAS photo folders.
      # Uploads from clients still go to UPLOAD_LOCATION above.
      - '${IMMICH_HOMES_BASE}/jose/Fotos:/external_jose'
      - '${IMMICH_HOMES_BASE}/jose/Fotos Telemóvel:/external_jose_telemovel'
      - '${IMMICH_HOMES_BASE}/ludovina/Fotos Telemóvel:/external_ludovina_telemovel'
      - '${IMMICH_HOMES_BASE}/hgo/Photos:/external_helder'
    env_file:
      - stack.env
    ports:
      # Bind to loopback so the only public path is via the reverse proxy
      # (NPM runs with network_mode: host, so 127.0.0.1 is reachable from it).
      # This prevents bypassing Cloudflare Access / NPM auth via direct LAN hits.
      - '127.0.0.1:2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # OpenVINO variant for Intel iGPU / VPU acceleration. Switch to one of
    # [armnn, cuda, rocm, rknn] (or drop the suffix for CPU-only) if the
    # hardware changes.
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-openvino
    device_cgroup_rules:
      - 'c 189:* rmw'           # /dev/bus/usb access for USB AI accelerators
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - model-cache:/cache
    env_file:
      - stack.env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:5b8f8c333bef895c925f56629d6ba90aea95a4f7391f62411e625267c600b19c
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:32324a2f41df5de9efe1af166b7008c3f55646f8d0e00d9550c16c9822366b4a
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment if your database is NOT on SSDs (it is, in this setup).
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${SSD_LOCATION}/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always

volumes:
  model-cache:
