---
# Lint rules for the compose files and workflows in this repo.
#
# Relaxations are deliberate:
#   line-length      — pinned image digests and devbox's inline Dockerfile
#                      cannot be wrapped without changing meaning.
#   document-start   — compose files conventionally omit the leading `---`.
#   truthy           — a workflow's `on:` key is not a boolean.
#   comments         — existing files use a single space before trailing `#`.
#
# Home Assistant rewrites its automations, scripts and scenes files from the
# UI in its own style (unindented sequences), so those three are not linted.

extends: default

ignore: |
  opencloud/
  traefik/plugins-local/
  homeassistant/config/automations.yaml
  homeassistant/config/scripts.yaml
  homeassistant/config/scenes.yaml

rules:
  line-length: disable
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
