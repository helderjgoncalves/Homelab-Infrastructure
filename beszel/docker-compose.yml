# Beszel — lightweight server + container monitoring.
#
# Two services on the same NAS:
#   - beszel       : the hub (web UI + SQLite history store)
#   - beszel-agent : reports host + Docker container metrics to the hub
#
# First run:
#   1. docker compose up -d
#   2. Reach the hub via its public hostname (NPM + Cloudflare Access), or
#      tunnel to it with `ssh -L 8090:127.0.0.1:8090 <nas>`, and create the
#      admin account. The hub is not published on the LAN.
#   3. Click "Add System" — copy the generated public key
#   4. Paste it as KEY below (or into a .env file), then `docker compose up -d`
#   5. Back in the UI, finish adding the system with host=localhost port=45876
#
# Docs: https://beszel.dev/  ·  https://github.com/henrygd/beszel

services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      # Hub UI on loopback only; reached externally via NPM + Cloudflare
      # Access. Does not affect hub <-> agent traffic, which uses the
      # agent's host-network listener on 45876.
      - 127.0.0.1:8090:8090
    volumes:
      - ./data:/beszel_data
      - ./socket:/beszel_socket
    # No healthcheck: image is distroless (no /bin/sh, no wget/curl/nc).
    # Liveness is monitored externally via Uptime Kuma's Docker Container
    # monitor ("running" state) and an HTTP monitor on the public URL.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    # host network = accurate per-interface network stats and easy hub<->agent talk
    network_mode: host
    volumes:
      - ./agent_data:/var/lib/beszel-agent
      # Read-only Docker socket so the agent can list containers and pull stats
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: 45876
      TZ: Europe/Lisbon
      # Hub public key — set KEY in .env (copy from .env.example).
      KEY: ${KEY}
    # No healthcheck: image is distroless (no /bin/sh, no nc).
    # The hub's UI already shows agent connectivity, which is the
    # authoritative liveness signal for the agent.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks: {}
