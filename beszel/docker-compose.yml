# Beszel — lightweight server + container monitoring.
#
# Two services on the same NAS:
#   - beszel       : the hub (web UI + SQLite history store)
#   - beszel-agent : reports host + Docker container metrics to the hub
#
# First run:
#   1. docker compose up -d
#   2. Reach the hub at https://beszel.hgoncalves.uk (Traefik, LAN + Tailscale),
#      or tunnel to it with `ssh -L 8090:127.0.0.1:8090 <nas>`, and create
#      the admin account.
#   3. Click "Add System" — copy the generated public key
#   4. Paste it as KEY below (or into a .env file), then `docker compose up -d`
#   5. Back in the UI, finish adding the system with host=localhost port=45876
#
# Docs: https://beszel.dev/  ·  https://github.com/henrygd/beszel

services:
  beszel:
    image: henrygd/beszel:0
    container_name: beszel
    restart: unless-stopped
    ports:
      # Hub UI on loopback only; Traefik is the way in. Does not affect
      # hub <-> agent traffic, which uses the agent's host-network listener
      # on 45876.
      - 127.0.0.1:8090:8090
    volumes:
      - ./data:/beszel_data
      - ./socket:/beszel_socket
    # The image has no shell, so the exec form. updates/ rolls a new image
    # back when this does not turn healthy.
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 60s
      start_period: 20s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  beszel-agent:
    image: henrygd/beszel-agent:0
    container_name: beszel-agent
    restart: unless-stopped
    # host network = accurate per-interface network stats and easy hub<->agent talk
    network_mode: host
    volumes:
      - ./agent_data:/var/lib/beszel-agent
    environment:
      LISTEN: 45876
      # Read-only Docker API from the socket-proxy stack, not docker.sock.
      DOCKER_HOST: tcp://127.0.0.1:2375
      TZ: Europe/Lisbon
      # Hub public key — set KEY in .env (copy from .env.example).
      KEY: ${KEY:?set KEY in .env}
    # Says only that the agent runs. The hub's UI shows whether it reports.
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 60s
      start_period: 20s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks: {}
