services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=100
      - UMASK=002
      - TZ=Europe/Lisbon
      - WEBUI_PORT=9080
      - TORRENTING_PORT=51513
    volumes:
      - ./appdata:/config
      - ${QBT_DOWNLOADS_DIR:?set QBT_DOWNLOADS_DIR in .env}:/downloads
      - ${QBT_MUSIC_DIR:?set QBT_MUSIC_DIR in .env}:/music
      - ${QBT_MOVIES_DIR:?set QBT_MOVIES_DIR in .env}:/movies
      - ${QBT_TV_DIR:?set QBT_TV_DIR in .env}:/tv
    ports:
      # WebUI is reachable only from the host; NPM (network_mode: host)
      # proxies it. qBittorrent itself must keep binding 0.0.0.0 inside the
      # container (WebUI\Address=*), otherwise docker-proxy cannot reach it.
      - 127.0.0.1:9080:9080
      # Torrent ports must stay reachable from the internet for inbound peers.
      - 51513:51513
      - 51513:51513/udp
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:9080/
      interval: 180s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks: {}
