services:
  dockge:
    image: louislam/dockge:1
    container_name: dockge
    restart: unless-stopped
    ports:
      - 127.0.0.1:5001:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      # Host path MUST equal container path so Dockge-generated compose files
      # resolve correctly when the Docker daemon reads them on the host.
      - ${STACKS_DIR}:${STACKS_DIR}
    environment:
      - DOCKGE_STACKS_DIR=${STACKS_DIR}
      - DOCKGE_ENABLE_CONSOLE=false
    # Image has no wget/curl, so probe via node (always present).
    # Exits 0 on any HTTP response, 1 on connection error.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('http').get('http://127.0.0.1:5001/',r=>process.exit(0)).on('error',()=>process.exit(1))
      interval: 180s
      timeout: 5s
      retries: 3
      start_period: 30s
networks: {}
