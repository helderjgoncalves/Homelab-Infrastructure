# One router + one service per hostname. Adding a service:
#   1. copy a block below, change the name, host and URL
#   2. save — Traefik reloads and issues the cert on its own
# DNS needs nothing new: AdGuard rewrites *.hgoncalves.uk to the NAS.
http:
  routers:
    # --- Public (reachable through the Cloudflare tunnel) ---
    photos:
      rule: Host(`photos.hgoncalves.uk`)
      service: photos
    drive:
      rule: Host(`drive.hgoncalves.uk`)
      service: drive
    collabora:
      rule: Host(`collabora.hgoncalves.uk`)
      service: collabora

    # --- Private (LAN + Tailscale) unless noted ---
    dash:
      rule: Host(`dash.hgoncalves.uk`)
      service: dash
      middlewares: [private]
    nas:
      rule: Host(`nas.hgoncalves.uk`)
      service: nas
      middlewares: [private]
    # Home LAN only, by choice: no Tailscale access to the ONT.
    router:
      rule: Host(`router.hgoncalves.uk`)
      service: router
      middlewares: [lan-only, router-cookie]
    dns:
      rule: Host(`dns.hgoncalves.uk`)
      service: dns
      middlewares: [private]
    traefik:
      rule: Host(`traefik.hgoncalves.uk`)
      service: api@internal
      middlewares: [private]
    dockge:
      rule: Host(`dockge.hgoncalves.uk`)
      service: dockge
      middlewares: [private]
    kuma:
      rule: Host(`kuma.hgoncalves.uk`)
      service: kuma
      middlewares: [private]
    beszel:
      rule: Host(`beszel.hgoncalves.uk`)
      service: beszel
      middlewares: [private]
    ntfy:
      rule: Host(`ntfy.hgoncalves.uk`)
      service: ntfy
      middlewares: [private]
    qbittorrent:
      rule: Host(`qbittorrent.hgoncalves.uk`)
      service: qbittorrent
      middlewares: [private]
    sonarr:
      rule: Host(`sonarr.hgoncalves.uk`)
      service: sonarr
      middlewares: [private]
    radarr:
      rule: Host(`radarr.hgoncalves.uk`)
      service: radarr
      middlewares: [private]
    prowlarr:
      rule: Host(`prowlarr.hgoncalves.uk`)
      service: prowlarr
      middlewares: [private]
    maintainerr:
      rule: Host(`maintainerr.hgoncalves.uk`)
      service: maintainerr
      middlewares: [private]
    requests:
      rule: Host(`requests.hgoncalves.uk`)
      service: requests
      middlewares: [private]

  services:
    photos:
      loadBalancer: {servers: [{url: http://127.0.0.1:2283}]}
    drive:
      loadBalancer: {servers: [{url: http://127.0.0.1:9200}]}
    collabora:
      loadBalancer: {servers: [{url: http://127.0.0.1:9980}]}
    dash:
      loadBalancer: {servers: [{url: http://127.0.0.1:8085}]}
    nas:
      loadBalancer:
        servers: [{url: https://127.0.0.1:5766}]
        serversTransport: insecure
    router:
      loadBalancer:
        servers: [{url: https://192.168.1.1}]
        serversTransport: insecure
    dns:
      loadBalancer: {servers: [{url: http://192.168.1.2}]}
    dockge:
      loadBalancer: {servers: [{url: http://127.0.0.1:5001}]}
    kuma:
      loadBalancer: {servers: [{url: http://127.0.0.1:3001}]}
    beszel:
      loadBalancer: {servers: [{url: http://127.0.0.1:8090}]}
    ntfy:
      loadBalancer: {servers: [{url: http://127.0.0.1:8088}]}
    qbittorrent:
      loadBalancer: {servers: [{url: http://127.0.0.1:9080}]}
    sonarr:
      loadBalancer: {servers: [{url: http://127.0.0.1:8989}]}
    radarr:
      loadBalancer: {servers: [{url: http://127.0.0.1:7878}]}
    prowlarr:
      loadBalancer: {servers: [{url: http://127.0.0.1:9696}]}
    maintainerr:
      loadBalancer: {servers: [{url: http://127.0.0.1:6246}]}
    requests:
      loadBalancer: {servers: [{url: http://127.0.0.1:5055}]}
