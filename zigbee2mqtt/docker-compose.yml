name: zigbee2mqtt
# Own stack, not the Home Assistant compose. HA restarts must not drop the
# coordinator. Do not start this while ZHA is enabled: the Dongle-M accepts
# one TCP client on 192.168.1.109:6638.
services:
  mosquitto:
    # Loopback only. Home Assistant is on the host network and uses
    # 127.0.0.1:1883. Zigbee2MQTT uses the same address.
    image: eclipse-mosquitto:2.0.22@sha256:81a6193ae693942a3231cd3ac52875b02b7e3a19da671b2fb4b55cc874c5b279
    container_name: mosquitto
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Lisbon
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:2.14.3@sha256:fb4a6b0f6868ad1cd6a9996479802b2420e599c3463b62bbff8c8cd9a908f43a
    container_name: zigbee2mqtt
    restart: unless-stopped
    network_mode: host
    depends_on:
      - mosquitto
    environment:
      - TZ=Europe/Lisbon
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8210').then(()=>process.exit(0)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
