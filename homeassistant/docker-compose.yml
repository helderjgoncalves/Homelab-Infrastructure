name: homeassistant
services:
  homeassistant:
    # Holds state (.storage, recorder DB) and migrates it in the monthly
    # releases, which also carry breaking changes. updates/ takes the patches
    # of this month's tag and rolls one back if it is not healthy. A new month
    # is mailed: read its breaking changes, take a backup, move the tag.
    image: ghcr.io/home-assistant/home-assistant:2026.11
    container_name: homeassistant
    restart: unless-stopped
    # Host networking is the HA-recommended mode: required for mDNS / SSDP /
    # HomeKit / Cast device discovery. It also puts 8123 on every host
    # interface, so HA's network settings bind its HTTP server to 127.0.0.1
    # and Traefik stays the only way in (see README.md).
    # The same host network is how HA reaches upsd on 127.0.0.1:3493.
    # See nas-host/README.md.
    network_mode: host
    environment:
      - TZ=Europe/Lisbon
    volumes:
      # HA configuration, automations, db, blueprints, custom_components
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    # Zigbee is the zigbee2mqtt stack, over TCP to the Dongle-M. Do not enable
    # ZHA in this container: the dongle accepts one client. Should a USB stick
    # ever replace the dongle, map just that device (check with
    # `ls -l /dev/serial/by-id/`) rather than going privileged:
    # devices:
    #   - /dev/serial/by-id/usb-YOUR_STICK_HERE:/dev/ttyUSB0
    healthcheck:
      # 127.0.0.1, not localhost: HA listens on IPv4 loopback only.
      test:
        - CMD-SHELL
        - wget -q --tries=1 --spider http://127.0.0.1:8123 || exit 1
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 180s
      start_interval: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
