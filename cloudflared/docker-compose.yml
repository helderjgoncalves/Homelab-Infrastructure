services:
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    dns:
      - ${LAN_DNS_IP:?set LAN_DNS_IP in .env}
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    command: tunnel --no-autoupdate --metrics 127.0.0.1:2000 run
    healthcheck:
      test:
        - CMD
        - cloudflared
        - tunnel
        - --metrics
        - 127.0.0.1:2000
        - ready
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 30s
networks: {}
