# What the morning run updates and what the Sunday mail reports.
# A container that is in no app is left alone.
#
# compose_container  runs `docker compose` for every stack. Its app is updated
#                    last, from a one-shot container.
#
# [apps.<key>]       one row in the mail. <key> names its icon, icons/<key>.png,
#                    and its lines in state/: a renamed key mails its pending
#                    release again.
#   title            the name in the mail
#   policy           floating  pull the tag the containers run; roll back if not healthy.
#                              The tag sets how far it moves: `v3.7` patches only,
#                              `2` minors too, `latest` everything. A newer release
#                              past the tag goes in the Sunday mail.
#                    semver    a patch that morning, a new minor wait_days after its .0,
#                              never another major (mailed instead); not rolled back
#                              unless rollback is set
#                    report    never changed; a newer release goes in the Sunday mail
#   containers       updated together, and only if all are running; a report
#                    app needs only the first. The first one's version is the
#                    one in the mail.
#   members          other containers of the app, only named in the log
#   releases         github:<owner>/<repo>, hub:<namespace>/<repo> (library/ for
#                    official images), plex (the QNAP package, once), or qts
#                    (the NAS firmware from QTS Live Update, once)
#   tag_prefix       before a version, makes its release tag and image tag ("v")
#   pin_minor        semver: only patches of the running minor; a newer minor goes in
#                    the Sunday mail and is installed by hand
#   rollback         semver: start the previous image again if the new one is not healthy
#   rollback_files   with rollback, or auto on a floating app: files in the first
#                    container saved before the update and put back before the previous
#                    image starts, such as a config or database the new version migrates.
#                    On a volume or bind mount. With auto, the container is stopped while
#                    they are copied to state/rollback/<key>/, and the copy stays there
#                    until the next one
#   hold_major       floating, for images with no major tag: a pulled image whose
#                    version label is another major is not started; it goes in
#                    the Sunday mail and is installed by hand
#   wait_days        semver, or with auto: days a release it would take by itself
#                    waits first, counted from the first release of its line (a
#                    semver minor's .0, `2026.12.0` for `2026.12`). 0, the default,
#                    takes it, or asks Workers AI, the first morning it is seen
#   critical         true for an app too costly to break with a major (DNS, ingress,
#                    photos): a new major is always installed by hand, never asked
#                    about or taken by itself, even with auto. --check fails if its tag would take
#                    a major anyway (`latest` with no hold_major)
#   image            floating, one container: the only image:tag it may run
#   version_file     JSON in the container whose "version" is the app's, for
#                    images with no version label
#   version_command  prints "version X.Y.Z" in the container, for the same
#   auto             off (the default), shadow or on, for github: releases. A release
#                    left to a hand (past a floating tag, a held major, a semver major
#                    or pin_minor minor), except a critical app's major, is shown to
#                    Workers AI the first morning it is seen, once, with its notes,
#                    the compose service and the files below. If changing the tag
#                    is all it takes, and no check
#                    in code says otherwise, shadow says so in the push and the mail; on
#                    installs it: the image line in the compose file, the pull, the
#                    health check and rollback, then a local commit, never pushed.
#                    Anything else stays by hand, with the reasons and the steps.
#                    Needs CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_AI_TOKEN in .env
#   inventory_file   with auto: JSON, or one JSON object per line, in the first
#   inventory_key    container listing what the setup uses, and the key of each
#   inventory_match  name in it: a breaking change that names one stays by hand.
#                    inventory_match is how the notes name it, "{}" for the bare name
#   context_files    with auto: files in the first container shown with the notes.
#                    Never one with secrets: they go to Workers AI
#   breaking_marker  with auto, floating: a release the tag takes by itself waits for
#   breaking_names   Workers AI when a line of its notes carries this marker and names
#                    something in the inventory, or nothing (the app itself).
#                    breaking_names is how a line names one, "{}" for the name
#   linked_notes     with auto: also read the pages the notes link as release notes,
#                    a migration guide or breaking changes
#
# Compose project, service and files come from the labels Compose puts on each
# container, so an override file is never dropped.

compose_container = "dockge"

[apps.immich]
title = "Immich"
policy = "semver"
containers = ["immich_server", "immich_machine_learning"]
members = ["immich_postgres", "immich_redis"]
releases = "github:immich-app/immich"
tag_prefix = "v"
critical = true
# A new minor waits a week, so the fixes of its first days are in.
wait_days = 7

[apps.cloudflare-tunnel]
title = "Cloudflared"
policy = "floating"
containers = ["cloudflare-tunnel"]
releases = "github:cloudflare/cloudflared"
version_command = ["cloudflared", "--version"]

[apps.traefik]
title = "Traefik"
policy = "floating"
containers = ["traefik"]
releases = "github:traefik/traefik"
tag_prefix = "v"
# All ingress. Its only releases past :v3 are majors, so it has no auto.
critical = true

[apps.uptime-kuma]
title = "Uptime Kuma"
policy = "floating"
containers = ["uptime-kuma"]
releases = "github:louislam/uptime-kuma"
version_file = "/app/package.json"
auto = "on"
linked_notes = true
rollback_files = ["/app/data/kuma.db", "/app/data/kuma.db-wal", "/app/data/kuma.db-shm"]

[apps.beszel]
title = "Beszel"
policy = "floating"
containers = ["beszel", "beszel-agent"]
releases = "github:henrygd/beszel"
tag_prefix = "v"

[apps.adguard]
title = "AdGuard Home"
policy = "semver"
containers = ["adguard"]
releases = "github:AdguardTeam/AdGuardHome"
tag_prefix = "v"
pin_minor = true
rollback = true
rollback_files = ["/opt/adguardhome/conf/AdGuardHome.yaml"]
# LAN DNS.
critical = true
auto = "shadow"

[apps.homeassistant]
title = "Home Assistant"
policy = "floating"
containers = ["homeassistant"]
releases = "github:home-assistant/core"
# Calendar versions: a patch can break things as well as a new month. The compose file pins the exact version, so
# every release is past the tag and Workers AI decides on each one.
auto = "on"
# The newest release must be 3 days old, so a quick fix of a .0 comes first. With the exact pin each release is its own
# line: a newer one starts the count again, and Home Assistant's weekly patches would outrun a longer wait.
wait_days = 3
linked_notes = true
# Only the domain of each integration set up goes to Workers AI.
inventory_file = "/config/.storage/core.config_entries"
inventory_key = "domain"
inventory_match = "/integrations/{}/"
context_files = ["/config/configuration.yaml", "/config/automations.yaml", "/config/scripts.yaml"]
rollback_files = [
  "/config/.storage",
  "/config/home-assistant_v2.db",
  "/config/home-assistant_v2.db-wal",
  "/config/home-assistant_v2.db-shm",
]

[apps.zigbee2mqtt]
title = "Zigbee2MQTT"
policy = "floating"
containers = ["zigbee2mqtt"]
releases = "github:Koenkk/zigbee2mqtt"
auto = "shadow"
linked_notes = true
# Only the model of each paired device goes to Workers AI.
inventory_file = "/app/data/database.db"
inventory_key = "modelId"
# Its configuration.yaml holds the network key, so it is saved, never shown.
rollback_files = [
  "/app/data/configuration.yaml",
  "/app/data/database.db",
  "/app/data/state.json",
  "/app/data/coordinator_backup.json",
]

[apps.opencloud-opencloud-1]
title = "OpenCloud"
policy = "report"
containers = ["opencloud-opencloud-1"]
members = ["opencloud-collabora-1", "opencloud-yjs-1"]
releases = "github:opencloud-eu/opencloud"

[apps.mosquitto]
title = "Mosquitto"
policy = "floating"
containers = ["mosquitto"]
releases = "hub:library/eclipse-mosquitto"

[apps.homer]
title = "Homer"
policy = "floating"
containers = ["homer"]
releases = "github:bastienwirtz/homer"
tag_prefix = "v"

# media-automation. linuxserver publishes no major tag, so these follow
# latest with hold_major.
[apps.radarr]
title = "Radarr"
policy = "floating"
containers = ["radarr"]
releases = "github:Radarr/Radarr"
tag_prefix = "v"
hold_major = true
auto = "on"
rollback_files = ["/config/radarr.db", "/config/radarr.db-wal", "/config/radarr.db-shm", "/config/config.xml"]

[apps.sonarr]
title = "Sonarr"
policy = "floating"
containers = ["sonarr"]
releases = "github:Sonarr/Sonarr"
tag_prefix = "v"
hold_major = true
auto = "on"
rollback_files = ["/config/sonarr.db", "/config/sonarr.db-wal", "/config/sonarr.db-shm", "/config/config.xml"]

[apps.prowlarr]
title = "Prowlarr"
policy = "floating"
containers = ["prowlarr"]
releases = "github:Prowlarr/Prowlarr"
tag_prefix = "v"
hold_major = true
auto = "on"
rollback_files = ["/config/prowlarr.db", "/config/prowlarr.db-wal", "/config/prowlarr.db-shm", "/config/config.xml"]

[apps.qbittorrent]
title = "qBittorrent"
policy = "floating"
containers = ["qbittorrent"]
releases = "hub:linuxserver/qbittorrent"
hold_major = true

[apps.maintainerr]
title = "Maintainerr"
policy = "floating"
containers = ["maintainerr"]
releases = "github:Maintainerr/Maintainerr"
tag_prefix = "v"
version_file = "/opt/app/apps/server/package.json"
auto = "on"
rollback_files = ["/opt/data/maintainerr.sqlite", "/opt/data/maintainerr.sqlite-wal", "/opt/data/maintainerr.sqlite-shm"]

[apps.seerr]
title = "Seerr"
policy = "floating"
containers = ["seerr"]
releases = "github:seerr-team/seerr"
tag_prefix = "v"
auto = "on"
rollback_files = ["/app/config/db", "/app/config/settings.json"]

[apps.plex]
title = "Plex"
policy = "report"
releases = "plex"

[apps.qts]
title = "QTS"
policy = "report"
releases = "qts"

[apps.dockge]
title = "Dockge"
policy = "floating"
containers = ["dockge"]
releases = "github:louislam/dockge"
version_file = "/app/package.json"
