---
name: validate

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Every .env.example ships blank values so nobody deploys a placeholder
      # by accident, but `${VAR:?}` treats blank as unset. Fill the blanks with
      # throwaway values whose shape matches the key, so the parse exercises
      # the real interpolation. A required variable missing from .env.example
      # stays unset and fails the next step, which is the point: the template
      # has to document everything a stack needs.
      - name: Generate throwaway .env files
        run: |
          for example in */.env.example; do
            awk -F= '
              /^[[:space:]]*#/ || !/=/          { print; next }
              { key = $1; value = substr($0, index($0, "=") + 1) }
              value != ""                       { print; next }
              key ~ /_IP$/                      { print key "=127.0.0.1"; next }
              key ~ /(_DIR|_LOCATION|_BASE|_BIN)$/ { print key "=/tmp/ci"; next }
                                                { print key "=ci" }
            ' "$example" > "$(dirname "$example")/.env"
          done

      - name: Validate every stack
        run: |
          status=0
          for file in */docker-compose.yml */compose.yaml; do
            [ -f "$file" ] || continue
            echo "::group::$file"
            docker compose -f "$file" config -q || status=1
            echo "::endgroup::"
          done
          exit $status

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install yamllint
      - run: yamllint --strict .

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Warning level and above: the scripts source a .env that only exists on
      # the Docker host, which shellcheck can only ever report as SC1091 info.
      - run: shellcheck --severity=warning pihole/scripts/*.sh

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret that was committed and later removed is
          # still a leaked secret.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks

      - name: Scan git history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner
