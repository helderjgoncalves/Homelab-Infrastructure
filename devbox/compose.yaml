services:
  devbox:
    image: devbox:latest
    container_name: devbox
    hostname: devbox
    build:
      context: .
      dockerfile_inline: |
        FROM debian:bookworm-slim

        ENV DEBIAN_FRONTEND=noninteractive \
            TZ=Etc/UTC \
            LANG=C.UTF-8

        RUN apt-get update && apt-get install -y --no-install-recommends \
            openssh-server \
            git git-lfs openssh-client \
            bash bash-completion nano vim \
            ca-certificates curl wget less tree jq htop tmux rsync \
            unzip zip file procps \
            build-essential make cmake pkg-config \
            python3 python3-pip python3-venv \
            nodejs npm \
            golang \
            iputils-ping dnsutils netcat-openbsd socat traceroute \
            sudo tzdata locales \
            && rm -rf /var/lib/apt/lists/*

        ARG USER_NAME=dev
        ARG USER_UID=1000
        ARG USER_GID=100
        RUN groupadd -g $${USER_GID} -o devgroup 2>/dev/null || true && \
            useradd -m -u $${USER_UID} -g $${USER_GID} -s /bin/bash $${USER_NAME} && \
            echo "$${USER_NAME} ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/$${USER_NAME} && \
            chmod 0440 /etc/sudoers.d/$${USER_NAME}

        RUN mkdir -p /var/run/sshd /home/$${USER_NAME}/.ssh && \
            chown -R $${USER_UID}:$${USER_GID} /home/$${USER_NAME}/.ssh && \
            chmod 700 /home/$${USER_NAME}/.ssh && \
            sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config && \
            sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config && \
            sed -i 's/^#*PubkeyAuthentication.*/PubkeyAuthentication yes/' /etc/ssh/sshd_config

        RUN printf '%s\n' \
            '#!/bin/bash' \
            'set -e' \
            'if [ -f /config/authorized_keys ]; then' \
            '  cp /config/authorized_keys /home/dev/.ssh/authorized_keys' \
            '  chown dev:users /home/dev/.ssh/authorized_keys' \
            '  chmod 600 /home/dev/.ssh/authorized_keys' \
            'fi' \
            'ssh-keygen -A' \
            'exec /usr/sbin/sshd -D -e -p 2222' \
            > /usr/local/bin/entrypoint.sh && \
            chmod +x /usr/local/bin/entrypoint.sh

        EXPOSE 2222
        ENTRYPOINT ["/usr/local/bin/entrypoint.sh"]
    volumes:
      - ./config:/config
      - ..:/projects
    ports:
      - 2222:2222
    restart: unless-stopped