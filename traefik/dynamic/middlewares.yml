http:
  middlewares:
    # Applied to every router on websecure (see the entrypoint flags).
    hsts:
      headers:
        stsSeconds: 63072000

    # Access layers. Tunnel traffic arrives from cloudflared's bridge IP, so
    # both also keep a router off the internet.
    #
    # private: LAN + the owner's Tailscale devices.
    private:
      ipAllowList:
        sourceRange:
          - 192.168.1.0/24
          - 100.98.39.35/32
          - 100.99.86.43/32

    # lan-only: home LAN only — not reachable over Tailscale either.
    lan-only:
      ipAllowList:
        sourceRange:
          - 192.168.1.0/24

    # Cloudflare's cookies are domain-scoped, so the browser sends cf_clearance
    # and CF_Authorization to every *.hgoncalves.uk name. The ONT's small header
    # buffer can't cope: keep only its own session cookie (named "Cookie").
    # The plugin applies the regex to each ;-separated cookie, so every other
    # cookie becomes an empty segment — e.g. ";Cookie=abc;".
    router-cookie:
      plugin:
        htransformation:
          Rules:
            - Name: keep-only-ont-session
              Header: ^Cookie$
              Type: RewriteValueRule
              Value: (?i)^(cookie=.*)$|^.*$
              ValueReplace: $1

  serversTransports:
    # For origins that only speak HTTPS with a self-signed cert (QTS, ONT).
    insecure:
      insecureSkipVerify: true
